<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Terminal</title>
  <style>
    :root {
      --green: #00ff66;
      --green-dim: #00b84a;
      --bg: #020604;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 100, 0.035) 0px,
        rgba(0, 255, 100, 0.035) 1px,
        transparent 1px,
        transparent 4px
      );
      z-index: 10;
    }

    .terminal {
      width: 100vw;
      height: 100vh;
      padding: 22px 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,255,102,.05), transparent 45%),
        #020604;
      text-shadow: 0 0 6px rgba(0, 255, 102, .65);
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(0,255,102,.35);
      font-size: 13px;
      color: #78ffad;
    }

    #output {
      height: calc(100vh - 70px);
      overflow: hidden;
      white-space: pre-wrap;
      font-size: clamp(12px, 1.1vw, 17px);
      line-height: 1.45;
    }

    .line { margin: 0; }
    .dim { color: var(--green-dim); opacity: .8; }
    .warn { color: #a7ffbe; }
    .bright { color: #d9ffe5; font-weight: 700; }
    .error { color: #7dffae; }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 1.05em;
      margin-left: 2px;
      vertical-align: -2px;
      background: var(--green);
      box-shadow: 0 0 9px var(--green);
      animation: blink .7s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .84);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
      z-index: 20;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(850px, 94vw);
      padding: 34px;
      border: 1px solid var(--green);
      background: rgba(0, 12, 5, .92);
      box-shadow: 0 0 35px rgba(0,255,102,.18), inset 0 0 35px rgba(0,255,102,.035);
      text-align: center;
    }

    .card h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 5vw, 58px);
      letter-spacing: 4px;
    }

    .card p {
      margin: 8px 0;
      color: #a9ffc3;
      font-size: clamp(13px, 1.5vw, 18px);
    }

    .final {
      margin: 26px 0 8px;
      font-size: clamp(18px, 2.4vw, 30px);
      font-weight: 700;
    }

    button {
      margin-top: 22px;
      padding: 11px 18px;
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      font: inherit;
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {
      background: var(--green);
      color: #001c09;
      box-shadow: 0 0 18px rgba(0,255,102,.45);
    }

    @media (max-width: 600px) {
      .terminal { padding: 14px; }
      .header { font-size: 10px; }
      #output { height: calc(100vh - 52px); }
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <main class="terminal">
    <div class="header">
      <span>FIRLY // SECURE TERMINAL</span>
      <span id="clock">--:--:--</span>
    </div>
    <div id="output"></div>
  </main>

  <section class="overlay" id="overlay" aria-hidden="true">
    <div class="card">
      <h1>ACCESS GRANTED</h1>
      <p class="final">CONGRATS. YOUR DEVICE HAS BEEN HACKED BY FIRLY.</p>
      <p class="dim">SYSTEM STATUS: CONNECTION TERMINATED</p>
      <button id="closeBtn">EXIT TERMINAL</button>
    </div>
  </section>

  <script>
    const output = document.getElementById('output');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const clock = document.getElementById('clock');

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const fakeTargets = [
      'kernel_cache', 'user_session', 'local_network', 'device_index',
      'system_registry', 'temp_storage', 'process_table', 'auth_gateway'
    ];

    const fakeOps = [
      'scanning', 'indexing', 'verifying', 'mapping', 'decrypting',
      'resolving', 'injecting', 'synchronizing', 'bypassing', 'extracting'
    ];

    function now() {
      return new Date().toLocaleTimeString('en-GB', { hour12: false });
    }

    function addLine(text, cls = '') {
      const line = document.createElement('div');
      line.className = `line ${cls}`;
      line.textContent = text;
      output.appendChild(line);

      // Keep the newest lines visible inside the terminal window.
      while (output.children.length > 72) output.removeChild(output.firstChild);
    }

    function randomHex(length = 8) {
      const chars = '0123456789ABCDEF';
      let s = '';
      for (let i = 0; i < length; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function updateClock() {
      clock.textContent = now();
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function typeLine(text, cls = '', speed = 7) {
      const line = document.createElement('div');
      line.className = `line ${cls}`;
      output.appendChild(line);

      for (const char of text) {
        line.textContent += char;
        await sleep(speed + Math.random() * 5);
      }
    }

    async function boot() {
      await typeLine('[BOOT] Initializing secure terminal...', 'bright', 8);
      await sleep(250);
      await typeLine(`[BOOT] Session ID: ${randomHex(16)}`, 'dim', 5);
      await typeLine('[BOOT] Establishing encrypted tunnel...', 'dim', 5);
      await typeLine('[OK] Tunnel established.', 'warn', 5);
      await sleep(350);
      await typeLine('> starting remote access protocol', '', 4);
      await typeLine('> loading modules ████████████████████ 100%', 'dim', 2);
      await sleep(400);

      const stageMessages = [
        '[NET] Enumerating local interfaces...',
        '[NET] Resolving active gateway...',
        '[AUTH] Testing session credentials...',
        '[AUTH] Session token located.',
        '[PROC] Reading process table...',
        '[PROC] Mapping background services...',
        '[FS] Indexing protected paths...',
        '[FS] Locating user-space data...',
        '[CRYPT] Initializing key exchange...',
        '[CRYPT] Key material synchronized.',
        '[SYNC] Synchronizing device metadata...',
        '[SYNC] Remote mirror responding...',
        '[TRACE] Suppressing diagnostic output...',
        '[TRACE] Local trace cleared.',
        '[CORE] Elevating privilege context...',
        '[CORE] Privilege escalation complete.'
      ];

      // Slow, denser terminal output so the fake sequence feels like a longer process.
      const spammer = setInterval(() => {
        const op = fakeOps[Math.floor(Math.random() * fakeOps.length)];
        const target = fakeTargets[Math.floor(Math.random() * fakeTargets.length)];
        const pct = Math.floor(Math.random() * 100) + 1;
        addLine(`[${now()}] ${op.padEnd(12)} ${target.padEnd(18)} ... ${String(pct).padStart(3, ' ')}% ${randomHex(12)}`, pct > 92 ? 'warn' : '');

        if (Math.random() < 0.34) {
          addLine(`         packet ${randomHex(6)} :: checksum ${randomHex(4)} :: status OK`, 'dim');
        }

        if (Math.random() < 0.13) {
          const message = stageMessages[Math.floor(Math.random() * stageMessages.length)];
          addLine(message, Math.random() < 0.45 ? 'bright' : '');
        }
      }, 145);

      // Keep the simulated sequence running for roughly half a minute before the final screen.
      await sleep(24000);
      clearInterval(spammer);

      addLine('');
      await typeLine('>>> FINALIZING ACCESS SEQUENCE ... 100% <<<', 'bright', 24);
      await sleep(1100);
      await typeLine('>>> ROOT ACCESS GRANTED <<<', 'bright', 28);
      await sleep(1200);
      await typeLine('>>> DEVICE COMPROMISED <<<', 'bright', 28);
      await sleep(1400);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      addLine('> session closed.', 'bright');
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });

    boot();
  </script>
</body>
</html>
